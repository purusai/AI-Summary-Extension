<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Options</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            min-width: 500px;
            min-height:300px;
            padding: 15px;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 15px;
            background-color: #374151;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #1F2937;
        }

        #success-message {
            color: green;
            display: none; /* Initially hidden */
        }
    </style>
    <link href="/src/style.css" rel="stylesheet">
</head>
<body>
    <h1>AI Summary Settings</h1>

    <div class="form-group">
        <label for="api-key"> Gemini API Key</label>
        <input type="password" id="api-key" name="api-key" placeholder="Enter your Gemini API Key" />

        <p>
            You can get an API key from
            <a href="https://ai.google.dev/gemini-api/docs/api-key"
                target="_blank">Google AI Studio</a>.
        </p>
    </div>

    <button id="save-button">Save Settings</button>
    <p id="success-message">
        Settings saved successfully!
    </p>
    <script src="options.js"></script>
</body>
</html>
