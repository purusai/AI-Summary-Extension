<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI summerizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            min-width: 500px;
            min-height:300px;
            padding: 15px;
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
        }


        .options {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 15px;
            background-color: #374151;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #1F2937;
        }

        #copy-btn {
            background-color: #C2185B;
        }
        
        #copy-btn:hover {
            background-color: #880E4F;
        }

        #summary-type {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        #result {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.5;
        }

        #result ul {
            padding-left: 20px;
        }

        #result li {
            margin-bottom: 10px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007BFF;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;

        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
    <link href="/src/style.css" rel="stylesheet">
</head>
<body>
    <h2>AI Summerizer</h2>
    
    <div class="options">
        <select id="summary-type">
        <option value="brief">Brief</option>
        <option value="detailed">Detailed</option>
        <option value="bullet-points">Bullet Points</option>
    </select>

    <button id="summarize">Summarize</button>
    <button id="copy-btn">Copy</button>
    </div>

    

    <pre id="result">Select a type and click Summerize...</pre>
    <script src="popup.js"></script>
</body>
</html>
